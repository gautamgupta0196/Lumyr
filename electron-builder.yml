appId: com.lumyr.app
productName: Lumyr
copyright: Copyright © 2024

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - dist-electron/**/*
  - python/**/*
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
  - "!**/node_modules/.bin"
  # opencode binaries are shipped per target arch via extraResources below;
  # npm's copies only match the machine that ran `npm ci`.
  - "!**/node_modules/opencode-ai{,/**}"
  - "!**/node_modules/opencode-{darwin,linux,windows}-*{,/**}"

# Extract python scripts from asar so Python subprocess can read them
asarUnpack:
  - "python/**/*"

extraResources:
  - from: resources/
    to: resources/
    filter:
      - "**/*"
      - "!python-mac-arm64/**"
      - "!python-mac-x64/**"
      - "!python-win/**"

afterPack: scripts/afterPack.js
afterSign: scripts/notarize.js

fileAssociations:
  - ext: lmr
    name: Lumyr Dashboard
    description: Lumyr Dashboard Package
    mimeType: application/x-lumyr
    icon: resources/lmr-icon
    role: Editor

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  icon: resources/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extraResources:
    - from: "resources/python-mac-${arch}"
      to: "resources/python-mac"
      filter:
        - "**/*"
    # Fetched per arch by scripts/fetch-opencode.mjs (~180 MB each).
    - from: "vendor/opencode/darwin-${arch}"
      to: "opencode"

win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  icon: resources/icon.ico
  extraResources:
    - from: "resources/python-win"
      to: "resources/python-win"
      filter:
        - "**/*"
    - from: "vendor/opencode/win32-${arch}"
      to: "opencode"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: "${productName}-Setup-${version}.${ext}"
  deleteAppDataOnUninstall: false
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true

publish:
  provider: github
  owner: gautamgupta0196
  repo: Lumyr
  private: true
  releaseType: release
